services:
  smtp4dev:
    image: rnwood/smtp4dev:3.15.0
    hostname: smtp4dev
    container_name: smtp4dev
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:143:143"
    volumes:
      - ${COMMON_PATH}\Smtp4Dev\volumes\data:/smtp4dev
      - ${COMMON_PATH}\Smtp4Dev\volumes\keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    networks:
      - smtp4dev-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.devtools-smtp.rule=Host(`smtp.devtools.localhost`)"
      - "traefik.http.routers.devtools-smtp.entrypoints=websecure"
      - "traefik.http.routers.devtools-smtp.tls=true"
      - "traefik.http.services.devtools-smtp.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
  smtp4dev-network:
    driver: bridge
